<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upper Body Motion Capture</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/+esm"
        }
      }
    </script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local Motion Lab</p>
          <h1>Upper Body Motion Capture</h1>
        </div>
        <div class="controls">
          <button id="startButton" class="primary-action" type="button">Start Capture</button>
          <button id="stopButton" class="secondary-action" type="button" disabled>Stop & Save</button>
        </div>
      </header>

      <section class="status-strip" aria-live="polite">
        <div>
          <span class="status-label">Status</span>
          <strong id="statusText">idle</strong>
        </div>
        <div>
          <span class="status-label">Samples</span>
          <strong id="sampleCount">0</strong>
        </div>
        <div>
          <span class="status-label">Tracked Nodes</span>
          <strong id="nodeCount">0</strong>
        </div>
        <div>
          <span class="status-label">Saved File</span>
          <strong id="savedFile">none</strong>
        </div>
      </section>

      <section class="workspace">
        <div class="video-panel">
          <div class="panel-header">
            <h2>Camera</h2>
            <span id="modelStatus">models unloaded</span>
          </div>
          <div class="video-stage">
            <video id="cameraVideo" playsinline muted></video>
            <canvas id="overlayCanvas" aria-hidden="true"></canvas>
            <div id="cameraPlaceholder" class="camera-placeholder">camera preview</div>
          </div>
        </div>

        <div class="scene-panel">
          <div class="panel-header">
            <h2>3D Coordinates</h2>
            <span>poseWorld + handWorld</span>
          </div>
          <div id="sceneRoot" class="scene-root" aria-label="3D coordinate view"></div>
        </div>
      </section>

      <section class="data-panel">
        <div class="panel-header">
          <h2>Latest Sample</h2>
          <span id="lastSampleTime">no sample</span>
        </div>
        <pre id="latestSample">{}</pre>
      </section>
    </main>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
